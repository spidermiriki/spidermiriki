  <circle cx="365" cy="74" r="1.1" fill="#ffffff" style="animation: twinkle 1.9s 0.5s infinite"/>
  <circle cx="410" cy="93" r="1.3" fill="#ffffff" style="animation: twinkle 2.2s 0s infinite"/>
