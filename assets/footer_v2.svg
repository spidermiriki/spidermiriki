<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 103">
  <style>
    @keyframes twinkle {
      0%, 62% { opacity: 1; }
      63%, 100% { opacity: 0; }
    }
  </style>

  <!-- CORNER HOOKS going up -->
  <rect x="0" y="0" width="3" height="60" fill="#5fc8e8"/>
  <rect x="797" y="0" width="3" height="60" fill="#5fc8e8"/>

  <!-- Blue separator line -->
  <rect y="60" width="800" height="3" fill="#5fc8e8"/>
  <!-- Black background -->
  <rect y="63" width="800" height="40" fill="#000000"/>

  <!-- Stars in black area -->
  <circle cx="18" cy="72" r="1.2" fill="#ffffff" style="animation: twinkle 1.9s 0.2s infinite"/>
  <circle cx="55" cy="82" r="1" fill="#5fc8e8" style="animation: twinkle 2.3s 0.7s infinite"/>
