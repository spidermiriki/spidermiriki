  <circle cx="140" cy="90" r="1" fill="#ffffff" style="animation: twinkle 2.1s 0.4s infinite"/>
  <circle cx="185" cy="76" r="1.2" fill="#5fc8e8" style="animation: twinkle 1.8s 0.9s infinite"/>
